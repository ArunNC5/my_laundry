name: iOS starter workflow

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build:
    name: Build and Deploy CICD for IOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'          
      - name: Install dependencies
        run: flutter pub get
      - name: Deploy-IOS
        uses: sparkfabrik/ios-build-action@v2.3.2
        env:
          IOS_APP_ID: com.highonswift.myLaundry
        with:
          upload-to-testflight: true
          increment-build-number: true
          build-pods: true
          pods-path: "ios/Podfile"
          configuration: Release
          export-method: app-store
          workspace-path: ${{ secrets.WORKSPACE_PATH }}
          project-path: ${{ secrets.PROJECT_PATH }}
          scheme: Runner
          output-path: build-${{ github.sha }}.ipa
          apple-key-id: ${{ secrets.ASCZ_API_KEY_ID }}
          apple-key-issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          apple-key-content: ${{ secrets.ASC_API_KEY }}
          team-id: ${{ secrets.TEAM_ID }}
          team-name: ${{ secrets.TEAM_NAME }}
          match-password: ${{ secrets.MATCH_PASSWORD }}
          match-git-url: ${{ secrets.MATCH_GIT_URL }}
          match-git-basic-authorization: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          match-build-type: "appstore"
          fastlane-env: development
          ios-app-id: com.highonswift.myLaundry
      
