name: Flutter iOS CI/CD with TestFlight

on:
  push:
    branches:
      - dev
      - development-ci-cd

jobs:
  ios-build:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup SSH Key for Fastlane Match
        uses: webfactory/ssh-agent@v0.9.0
        with:
          # Use the private key you generated specifically for the CI runner
          ssh-private-key: ${{ secrets.MATCH_SSH_KEY }}

      - name: Build and Deploy to TestFlight
        uses: sparkfabrik/ios-build-action@v2.3.0
        with:
          upload-to-testflight: true
          increment-build-number: true
          build-pods: true
          pods-path: "ios/Podfile"
          configuration: Release
          export-method: app-store
          workspace-path: "ios/Runner.xcworkspace"
          project-path: "ios/Runner.xcodeproj"
          scheme: "Runner" 
          apple-key-id: ${{ secrets.ASCZ_API_KEY_ID }}
          apple-key-issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          apple-key-content: ${{ secrets.ASC_API_KEY }}
          team-id: "7BXGN254MD"
          team-name: "Prahaladasumiran Techlabs Private Limited"
          match-password: ${{ secrets.MATCH_PASSWORD }}
          match-git-url: "git@github.com:ArunNC5/Highohswift_mylaundry.git"
          match-build-type: "appstore"
          ios-app-id: com.highonswift.myLaundry
          browserstack-upload: false 
          output-path: Runner.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-laundry-ios
          path: Runner.ipa
