name: Flutter iOS CI/CD with TestFlight

on:
  push:
    branches:
      - dev
      - development-ci-cd

jobs:
  ios-build:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'
          channel: stable
          architecture: arm64

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Flutter Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Flutter Tests
        run: flutter test

      - name: Install iOS dependencies (CocoaPods)
        run: |
          cd ios
          pod install

      - name: Install Fastlane
        # Installing globally is necessary when not using a Gemfile outside the directory
        run: sudo gem install fastlane -NV

      # CRUCIAL STEP: Setup SSH Agent and inject the key for 'match'
      # This resolves the "Permission denied (publickey)" error when cloning the private certificates repo
      - name: Setup SSH Key for Fastlane Match
        uses: webfactory/ssh-agent@v0.9.0
        with:
          # Use the private key you generated specifically for the CI runner
          ssh-private-key: ${{ secrets.MATCH_SSH_KEY }}
          
      - name: Build IPA + Upload to TestFlight
        # Set all necessary secrets as environment variables for Fastlane
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
        run: |
          cd ios
          # Execute the Fastlane lane that includes: match, gym, and upload_to_testflight
          fastlane beta

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-laundry-ios
          path: build/ios/Runner.ipa
